[project]
name = "cmf-studio"
version = "0.1.0"
description = "Mac companion for the CMF Watch Pro 2: watchd daemon, health sync, face studio, MCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned to the commit audited in research/findings.md (refs/PINS.md). No license file upstream,
    # so we depend on it instead of copying code; our fixes live in cmfstudio.ble.
    "cmfkit @ git+https://github.com/TechJeeper/CMF-Open@37781b12aa9d9378aec6600c1e89a407413b6400",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "keyring>=25",
    "playwright>=1.48",
    "pillow>=11",
    "numpy>=2",
]

[project.scripts]
cmf = "cmfstudio.cli.main:main"
watchd = "cmfstudio.watchd:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cmfstudio"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
